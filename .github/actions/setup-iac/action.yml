name: Set up Terraform + Terragrunt and cloud credentials
description: Installs pinned Terraform/Terragrunt and authenticates to one cloud with the Terraform identity (OIDC, no keys).
inputs:
  cloud:
    description: gcp or aws
    required: true
  terraform-version:
    default: "1.13.4"
  terragrunt-version:
    default: "0.99.5"
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    - name: Install Terragrunt
      shell: bash
      run: |
        curl -fsSL -o /usr/local/bin/terragrunt \
          "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ inputs.terragrunt-version }}/terragrunt_linux_amd64"
        chmod +x /usr/local/bin/terragrunt
        terragrunt --version
    - if: inputs.cloud == 'gcp'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
        service_account: ${{ env.GCP_TERRAFORM_SA }}
    - if: inputs.cloud == 'aws'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
