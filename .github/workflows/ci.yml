# Required PR checks. Everything here blocks the merge.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehearse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/rehearse_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build (only what the PR affects)
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm turbo run lint typecheck test build --affected

      - name: Lint, typecheck, test, build (everything)
        if: github.event_name != 'pull_request'
        run: pnpm turbo run lint typecheck test build

      - name: Validate every environment's runtime config against this commit
        run: |
          pnpm --filter @rehearse/config build
          pnpm validate:config

      - name: Render every release spec (proves templates + config + code agree)
        run: |
          d="sha256:$(printf '0%.0s' $(seq 64))"
          for cloud_env in gcp:dev gcp:uat gcp:prod aws:uat aws:prod; do
            cloud="${cloud_env%%:*}" env="${cloud_env##*:}"
            for service in api web; do
              node scripts/render-release.mjs --cloud "$cloud" --env "$env" --service "$service" \
                --image "registry/$service@$d" --collector-image "registry/collector@$d" \
                --version "$GITHUB_SHA" --project demo --account-id 000000000000 --region us-east-1 \
                --api-url https://api.example --grafana-endpoint https://otlp.example --grafana-instance-id 1 \
                --out "/tmp/$cloud-$env-$service.out"
            done
          done

      - name: Lint shell scripts
        run: shellcheck -x -P deploy/scripts deploy/scripts/*.sh

  images:
    name: Build & scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ., file: apps/api/Dockerfile }
          - { image: web, context: ., file: apps/web/Dockerfile }
          - { image: collector, context: deploy/otel, file: deploy/otel/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: rehearse/${{ matrix.image }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rehearse/${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
