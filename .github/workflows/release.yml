# On every merge to main: build each image ONCE, push it to Artifact Registry,
# copy the identical bytes (same digest) to ECR, then deploy to gcp-dev.
# Later environments are reached only through promote.yml, by digest.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "infra/**"]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: vars.GCP_PROJECT_ID != ''  # skip cleanly until docs/SETUP.md / bootstrap/ has been run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { image: api, context: ., file: apps/api/Dockerfile }
          - { image: web, context: ., file: apps/web/Dockerfile }
          - { image: collector, context: deploy/otel, file: deploy/otel/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: imjasonh/setup-crane@v0.4
      - id: exists
        name: Skip if this commit was already built (tags are immutable)
        env:
          REF: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rehearse/${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          gcloud auth print-access-token | crane auth login "${REF%%/*}" -u oauth2accesstoken --password-stdin
          if digest="$(crane digest "$REF" 2>/dev/null)"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "| ${{ matrix.image }} | \`$digest\` (already built) |" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - id: push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rehearse/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - if: steps.exists.outputs.found != 'true'
        run: echo "| ${{ matrix.image }} | \`${{ steps.push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"

  mirror:
    name: Copy images to ECR by digest
    needs: build
    if: vars.AWS_ACCOUNT_ID != ''  # AWS is optional: GCP-only until it's set up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: imjasonh/setup-crane@v0.4
      - name: crane copy (same bytes, same digest)
        env:
          GAR: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rehearse
          ECR_HOST: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          gcloud auth print-access-token | crane auth login "${GAR%%/*}" -u oauth2accesstoken --password-stdin
          aws ecr get-login-password | crane auth login "$ECR_HOST" -u AWS --password-stdin
          for image in api web collector; do
            src="$GAR/$image:sha-$GITHUB_SHA"
            dst="$ECR_HOST/rehearse/$image:sha-$GITHUB_SHA"
            crane digest "$dst" >/dev/null 2>&1 || crane copy "$src" "$dst"
            [[ "$(crane digest "$src")" == "$(crane digest "$dst")" ]] || { echo "::error::digest mismatch for $image"; exit 1; }
            echo "$image $(crane digest "$dst")"
          done

  deploy-dev:
    name: Deploy gcp-dev
    needs: [build, mirror]
    # Runs when the ECR copy succeeded or was skipped (no AWS yet).
    if: always() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.mirror.result)
    uses: ./.github/workflows/deploy-gcp.yml
    secrets: inherit
    with:
      environment: dev
      version: ${{ github.sha }}

  not-configured:
    if: vars.GCP_PROJECT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Cloud access isn't configured yet (no GCP_PROJECT_ID repo variable). Run bootstrap/ or docs/SETUP.md; skipping."
