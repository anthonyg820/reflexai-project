# Temporary: read gcp-dev Cloud Run logs to diagnose intermittent 5xx. Runs on push to diag/**.
name: Diagnose gcp-dev
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
  id-token: write
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Revisions and traffic
        run: |
          for s in rehearse-dev-api rehearse-dev-web; do
            echo "== $s"; gcloud run services describe $s --project ${{ vars.GCP_PROJECT_ID }} --region ${{ vars.GCP_REGION }} --format='yaml(status.traffic,status.latestReadyRevisionName,spec.template.spec.containers[].resources)'
          done
      - name: Web container stderr / errors (last 6h)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="rehearse-dev-web" AND labels.container_name="web" AND NOT httpRequest:* AND NOT jsonPayload.level="info" AND NOT jsonPayload.level=30' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=6h --limit=120 \
            --format='value(timestamp, severity, textPayload, jsonPayload.msg, jsonPayload.err.message, jsonPayload.status, jsonPayload.path)' | cut -c1-500
      - name: API non-info logs (last 6h)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="rehearse-dev-api" AND labels.container_name="api" AND NOT httpRequest:* AND NOT jsonPayload.level="info" AND NOT jsonPayload.level=30' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=6h --limit=60 \
            --format='value(timestamp, severity, textPayload, jsonPayload.msg, jsonPayload.err.message, jsonPayload.context)' | cut -c1-400
