# Temporary: read gcp-dev Cloud Run logs to diagnose intermittent 5xx. Runs on push to diag/**.
name: Diagnose gcp-dev
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
  id-token: write
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Revisions and traffic
        run: |
          for s in rehearse-dev-api rehearse-dev-web; do
            echo "== $s"; gcloud run services describe $s --project ${{ vars.GCP_PROJECT_ID }} --region ${{ vars.GCP_REGION }} --format='yaml(status.traffic,status.latestReadyRevisionName,spec.template.spec.containers[].resources)'
          done
      - name: 5xx requests (last 3h)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev" AND httpRequest.status>=500' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=3h --limit=60 \
            --format='table(timestamp, resource.labels.service_name, resource.labels.revision_name, httpRequest.status, httpRequest.requestMethod, httpRequest.requestUrl, httpRequest.latency)'
      - name: Errors and warnings from the containers (last 3h)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev" AND (severity>=WARNING OR textPayload=~"(?i)error|terminat|exit|uncaught|memory|timeout")' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=3h --limit=150 \
            --format='value(timestamp, resource.labels.service_name, labels.container_name, severity, textPayload, jsonPayload.msg, jsonPayload.err.message, jsonPayload.message)' | cut -c1-400
      - name: System events (crashes, OOM, restarts)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev" AND logName=~"varlog/system"' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=3h --limit=60 \
            --format='value(timestamp, resource.labels.service_name, severity, textPayload)' | cut -c1-300
