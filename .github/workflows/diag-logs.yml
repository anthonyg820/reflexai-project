# Temporary: read gcp-dev Cloud Run logs to diagnose intermittent 5xx. Runs on push to diag/**.
name: Diagnose gcp-dev
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
  id-token: write
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Revisions and traffic
        run: |
          for s in rehearse-dev-api rehearse-dev-web; do
            echo "== $s"; gcloud run services describe $s --project ${{ vars.GCP_PROJECT_ID }} --region ${{ vars.GCP_REGION }} --format='yaml(status.traffic,status.latestReadyRevisionName,spec.template.spec.containers[].resources)'
          done
      - name: Any entries at all (sanity)
        run: gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev"' --project ${{ vars.GCP_PROJECT_ID }} --freshness=1h --limit=5 --format='value(timestamp, logName, resource.labels.service_name)'
      - name: Requests with status >= 400 (last 3h)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev" AND httpRequest.status>=400' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=3h --limit=80 \
            --format='value(timestamp, resource.labels.service_name, httpRequest.status, httpRequest.requestMethod, httpRequest.requestUrl, httpRequest.latency)'
      - name: Structured logs at level >= 40 (pino warn/error) (last 3h)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev" AND (jsonPayload.level>=40 OR jsonPayload.level="error" OR jsonPayload.level="warn")' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=3h --limit=80 \
            --format='json(timestamp, resource.labels.service_name, jsonPayload)' | head -c 30000
      - name: Last 40 api + web lines (any)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name=~"rehearse-dev" AND NOT httpRequest:*' \
            --project ${{ vars.GCP_PROJECT_ID }} --freshness=1h --limit=40 \
            --format='value(timestamp, resource.labels.service_name, labels.container_name, textPayload, jsonPayload.msg, jsonPayload.message)' | cut -c1-300
