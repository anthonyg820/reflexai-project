# Non-secret runtime config for rehearse-api in gcp-prod.
# Shipped with the image as ONE Cloud Run revision (gcloud run deploy --env-vars-file).
# Validated in CI against this commit's schema: pnpm validate:config
DEPLOY_ENV: "prod"
CLOUD_PROVIDER: "gcp"
SCORING_RUBRIC: "rubric-a"
CONFIG_VALIDATION: "startup"
LOG_LEVEL: "info"
MIGRATE_ON_START: "true"
DB_SSL: "true"
